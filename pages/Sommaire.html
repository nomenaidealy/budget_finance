<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sommaire</title>
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="container py-5">

  <h1 class="text-center mb-5">Sommaire</h1>

  <div id="sommaire"></div>

  <script>
    fetch('/api/sommaire')
      .then(reponse => reponse.json())
      .then(contenu => {
        const conteneurSommaire = document.getElementById('sommaire');

        contenu.chapitres.forEach(chapitre => {
          const blocChapitre = document.createElement('div');
          blocChapitre.className = 'toc-item mt-3';
          blocChapitre.innerHTML = `<a href="${chapitre.lien || '#'}" class="chapter toc-title">${chapitre.titre}</a>
                                    <span class="toc-number">${chapitre.numero}</span>`;
          conteneurSommaire.appendChild(blocChapitre);

          chapitre.sousChapitres.forEach(sousChapitre => {
            const blocSousChapitre = document.createElement('div');
            blocSousChapitre.className = 'toc-item ms-4';
            blocSousChapitre.innerHTML = `<a href="${sousChapitre.lien || '#'}" class="subchapter toc-title">${sousChapitre.titre}</a>
                                          <span class="toc-number">${sousChapitre.numero}</span>`;
            conteneurSommaire.appendChild(blocSousChapitre);
          });
        });

        const titreTableaux = document.createElement('h2');
        titreTableaux.id = 'tableaux';
        titreTableaux.className = 'mt-5 chapter';
        titreTableaux.textContent = 'Liste des tableaux';
        conteneurSommaire.appendChild(titreTableaux);

        contenu.tableaux.forEach(tableau => {
          const blocTableau = document.createElement('div');
          blocTableau.className = 'toc-item';
          blocTableau.innerHTML = `<a href="${tableau.lien || '#'}" class="chapter toc-title">${tableau.titre}</a>
                                   <span class="toc-number">${tableau.numero}</span>`;
          conteneurSommaire.appendChild(blocTableau);
        });

        const titreFigures = document.createElement('h2');
        titreFigures.id = 'figures';
        titreFigures.className = 'mt-5 chapter';
        titreFigures.textContent = 'Liste des figures';
        conteneurSommaire.appendChild(titreFigures);

        contenu.figures.forEach(figure => {
          const blocFigure = document.createElement('div');
          blocFigure.className = 'toc-item subchapter';
          blocFigure.innerHTML = `<a href="${figure.lien || '#'}" class="subchapter toc-title">${figure.titre}</a>
                                  <span class="toc-number">${figure.numero}</span>`;
          conteneurSommaire.appendChild(blocFigure);
        });
      })
      .catch(erreur => console.error('Erreur lors du chargement du sommaire :', erreur));
  </script>

  <a href="../index.html">Retour</a>

</body>
</html>
